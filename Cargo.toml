[package]
name = "rage"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
reqwest = { version = "0.11", features = ["blocking", "json"] }
tokio = { version = "1", features = ["full"] }
comfy-table = "7.1"
governor = "0.6"
nonzero_ext = "0.3"
sysinfo = "0.30"
serde_json = "1.0.149"
num_cpus = "1.17.0"
terminal_size = "0.4"
tokio-util = "0.7.18"
clap = { version = "4.0", features = ["derive"] }
chrono = "0.4"
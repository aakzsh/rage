# test.yaml
host: "http://127.0.0.1:8080"
testname: "300k"
max_cores: -1
users: 300000
rampup: 75
session_duration: 150
runtime: 230
sleep: 20
csv_config: "users.csv"
steps:
  - get:
      endpoint: "/v1/login"
      capture:
        token: "json.token"
  - post:
      endpoint: "/v1/contact"
      headers: {"X-Priority": "High", "Authorization": "Bearer $token"}
      body:
        email: "$csv.email"
  - get:
      endpoint: "/v2/profile"
  - get:
      endpoint: "/v1/products/list"
  - post:
      endpoint: "/v1/cart/add"
      body: {"item_id": 101, "qty": 1}
common_headers:
  platform: "web"